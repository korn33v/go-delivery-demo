name: go-delivery-demo
x-app-env: &app-env
  HTTP_ADDR: :8080
  MIGRATIONS_PATH: /app/migrations
  OPENAPI_PATH: /app/api/openapi.yaml
  SWAGGER_PATH: /app/swagger
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  KAFKA_BROKER: kafka:9092
x-app-health: &app-health
  test: [CMD, /probe, http://localhost:8080/health]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 30s
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-admin-local}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-demo-order-local}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-demo-payment-local}
      FULFILLMENT_DB_PASSWORD: ${FULFILLMENT_DB_PASSWORD:-demo-fulfillment-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      retries: 30
  kafka:
    image: apache/kafka:4.3.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.paid.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fulfillment.status-changed.v1 --partitions 3 --replication-factor 1
  jaeger:
    build: {context: ., dockerfile: deploy/jaeger/Dockerfile}
    command: [--config, /etc/jaeger/config.yaml]
    ports: ["127.0.0.1:16686:16686"]
    volumes: ["./deploy/jaeger/config.yaml:/etc/jaeger/config.yaml:ro"]
    healthcheck:
      test: [CMD, /probe, http://127.0.0.1:13133/status]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s


  loki:
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki/config.yaml]
    ports: 
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      # Исправленный чистый sh-скрипт (127.0.0.1) для проверки HTTP-ответа
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s # Даем Loki время спокойно развернуть порты перед первыми проверками


  otel-collector:
    build: {context: ., dockerfile: deploy/otel/Dockerfile}
    command: [--config=/etc/otel/config.yaml]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:8889:8889", "127.0.0.1:13133:13133"]
    volumes: ["./deploy/otel/config.yaml:/etc/otel/config.yaml:ro"]
    depends_on:
      jaeger: {condition: service_healthy}
      loki: {condition: service_healthy}
    healthcheck:
      test: [CMD, /probe, http://localhost:13133/]
      interval: 5s
      retries: 30
  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=24h]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:9090/-/ready]
      interval: 5s
      retries: 30
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
      loki: {condition: service_healthy}
      jaeger: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:3000/api/health]
      interval: 5s
      retries: 30
  payment-service:
    build: {context: ., dockerfile: services/payment/Dockerfile}
    environment:
      <<: *app-env
      DB_URL: postgres://payment_user:${PAYMENT_DB_PASSWORD:-demo-payment-local}@postgres:5432/payment_db?sslmode=disable
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      otel-collector: {condition: service_healthy}
    healthcheck: *app-health
  order-service:
    build: {context: ., dockerfile: services/order/Dockerfile}
    environment:
      <<: *app-env
      DB_URL: postgres://order_user:${ORDER_DB_PASSWORD:-demo-order-local}@postgres:5432/order_db?sslmode=disable
      PAYMENT_URL: http://payment-service:8080
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      payment-service: {condition: service_healthy}
      otel-collector: {condition: service_healthy}
    healthcheck: *app-health
  fulfillment-service:
    build: {context: ., dockerfile: services/fulfillment/Dockerfile}
    environment:
      <<: *app-env
      DB_URL: postgres://fulfillment_user:${FULFILLMENT_DB_PASSWORD:-demo-fulfillment-local}@postgres:5432/fulfillment_db?sslmode=disable
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    healthcheck: *app-health
  demo-tools:
    profiles: [tools]
    build: {context: ., dockerfile: Dockerfile, target: tools}
    environment:
      ORDER_URL: http://order-service:8080
      PAYMENT_URL: http://payment-service:8080
      FULFILLMENT_URL: http://fulfillment-service:8080
      KAFKA_BROKER: kafka:9092
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      JAEGER_URL: http://jaeger:16686
      GRAFANA_URL: http://grafana:3000
      OTEL_HEALTH_URL: http://otel-collector:13133/
      ORDER_DB_URL: postgres://order_user:${ORDER_DB_PASSWORD:-demo-order-local}@postgres:5432/order_db?sslmode=disable
      PAYMENT_DB_URL: postgres://payment_user:${PAYMENT_DB_PASSWORD:-demo-payment-local}@postgres:5432/payment_db?sslmode=disable
      FULFILLMENT_DB_URL: postgres://fulfillment_user:${FULFILLMENT_DB_PASSWORD:-demo-fulfillment-local}@postgres:5432/fulfillment_db?sslmode=disable
    volumes: ["./.demo:/work/.demo"]
  tests:
    profiles: [test]
    build: {context: ., dockerfile: Dockerfile, target: test}
    environment:
      ORDER_DB_URL: postgres://order_user:${ORDER_DB_PASSWORD:-demo-order-local}@postgres:5432/order_db?sslmode=disable
      PAYMENT_DB_URL: postgres://payment_user:${PAYMENT_DB_PASSWORD:-demo-payment-local}@postgres:5432/payment_db?sslmode=disable
      FULFILLMENT_DB_URL: postgres://fulfillment_user:${FULFILLMENT_DB_PASSWORD:-demo-fulfillment-local}@postgres:5432/fulfillment_db?sslmode=disable
      KAFKA_BROKER: kafka:9092
volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:
networks:
  default:
    name: go-delivery-demo-network
